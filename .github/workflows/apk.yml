name: Construire l'APK Android
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - index.html
      - apk/**
      - .github/workflows/apk.yml
permissions:
  contents: write
concurrency:
  group: apk
  cancel-in-progress: true
defaults:
  run:
    working-directory: apk
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - name: Installer Capacitor
        run: npm install --no-audit --no-fund
      - name: Préparer l'application web
        run: |
          rm -rf www && mkdir www
          python3 - <<'PY'
          import glob, os
          src = '../index.html'
          if not os.path.exists(src):
              found = sorted(glob.glob('../*.html'))
              if not found:
                  raise SystemExit("Aucun fichier .html a la racine du depot")
              src = found[0]
          s = open(src, encoding='utf-8').read()
          shim = open('native-shim.js', encoding='utf-8').read()
          i = s.lower().rfind('</body>')
          if i < 0:
              raise SystemExit("Balise </body> introuvable")
          s = s[:i] + '<script>\n' + shim + '\n</script>\n' + s[i:]
          open('www/index.html', 'w', encoding='utf-8').write(s)
          print('Source :', src)
          PY
      - name: Créer le projet Android
        run: |
          npx cap add android
          npx cap sync android
      - name: Plugin d'impression, icônes, écran de démarrage
        run: |
          pip install --quiet --break-system-packages pillow
          JAVA_DIR=$(dirname "$(find android/app/src/main/java -name MainActivity.java | head -1)")
          cp MainActivity.java PrintHtmlPlugin.java "$JAVA_DIR/"
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          import glob, os
          im = Image.open('icon.png').convert('RGB')
          bg = im.getpixel((2, 2))
          res = 'android/app/src/main/res'
          legacy = {'mdpi': 48, 'hdpi': 72, 'xhdpi': 96, 'xxhdpi': 144, 'xxxhdpi': 192}
          fore = {'mdpi': 108, 'hdpi': 162, 'xhdpi': 216, 'xxhdpi': 324, 'xxxhdpi': 432}
          def masked(n, shape):
              ic = im.resize((n, n), Image.LANCZOS).convert('RGBA')
              m = Image.new('L', (n * 4, n * 4), 0)
              d = ImageDraw.Draw(m)
              if shape == 'round':
                  d.ellipse((0, 0, n * 4 - 1, n * 4 - 1), fill=255)
              else:
                  d.rounded_rectangle((0, 0, n * 4 - 1, n * 4 - 1), int(n * 4 * 0.18), fill=255)
              ic.putalpha(m.resize((n, n), Image.LANCZOS))
              return ic
          for d, n in legacy.items():
              p = f'{res}/mipmap-{d}'
              os.makedirs(p, exist_ok=True)
              masked(n, 'square').save(f'{p}/ic_launcher.png')
              masked(n, 'round').save(f'{p}/ic_launcher_round.png')
              f = fore[d]
              s = int(f * 0.72)
              canvas = Image.new('RGBA', (f, f), (0, 0, 0, 0))
              canvas.paste(im.resize((s, s), Image.LANCZOS).convert('RGBA'), ((f - s) // 2, (f - s) // 2))
              canvas.save(f'{p}/ic_launcher_foreground.png')
          color = '#%02X%02X%02X' % bg
          open(f'{res}/values/ic_launcher_background.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<resources>\n    <color name="ic_launcher_background">' + color + '</color>\n</resources>\n')
          for f in glob.glob(f'{res}/drawable*/splash.png'):
              os.remove(f)
          os.makedirs(f'{res}/drawable', exist_ok=True)
          open(f'{res}/drawable/splash.xml', 'w').write(
              '<?xml version="1.0" encoding="utf-8"?>\n<shape xmlns:android="http://schemas.android.com/apk/res/android">\n    <solid android:color="' + color + '"/>\n</shape>\n')
          st = f'{res}/values/styles.xml'
          t = open(st, encoding='utf-8').read()
          old = '<item name="android:background">@drawable/splash</item>'
          assert old in t
          t = t.replace(old, old + '\n        <item name="windowSplashScreenBackground">@color/ic_launcher_background</item>')
          open(st, 'w', encoding='utf-8').write(t)
          PY
      - name: Version et signature
        run: |
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          cat >> android/app/build.gradle <<GRADLE

          android {
              signingConfigs {
                  nyaina {
                      storeFile file("${GITHUB_WORKSPACE}/apk/ny-aina.keystore")
                      storePassword "e7ea4c4475c6712a"
                      keyAlias "nyaina"
                      keyPassword "e7ea4c4475c6712a"
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.nyaina
                  }
              }
          }
          GRADLE
      - name: Compiler l'APK
        working-directory: apk/android
        run: ./gradlew assembleRelease --no-daemon
      - name: Publier l'APK (page Releases)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk NyAinaMeds.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest NyAinaMeds.apk --title "Ny Aina Med's (APK Android)" --notes "Version ${{ github.run_number }}. Télécharger NyAinaMeds.apk puis l'ouvrir sur le téléphone."
